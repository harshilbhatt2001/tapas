[package]
name = "tapas-server"
description = "tapas server: JSON API, sign-in, source sync."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "tapas-server"
path = "src/main.rs"

[dependencies]
tapas-core.workspace = true
tapas-sources.workspace = true

anyhow.workspace = true
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa.workspace = true
utoipa-axum = "0.3.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
